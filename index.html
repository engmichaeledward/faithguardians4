<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Faith Guardians — حُراس الإيمان</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--gold:#e8b64c;--gold2:#f7d98c;--parch:#f6ead0;--ink:#3b2a18;--green:#2f9e63;--red:#c04434}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1206;font-family:'Cairo','Segoe UI',Tahoma,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
canvas#game{position:fixed;inset:0;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer;border:none}

#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#prog{position:absolute;top:calc(8px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  width:min(560px,86vw);height:56px;background:rgba(26,16,4,.55);border:1px solid rgba(232,182,76,.45);border-radius:16px}
#prog .line{position:absolute;top:22px;left:26px;right:26px;height:4px;border-radius:4px;background:rgba(255,255,255,.18)}
#prog .fill{position:absolute;top:22px;left:26px;height:4px;border-radius:4px;background:linear-gradient(90deg,#b98a2e,var(--gold2));width:0}
#prog .nd{position:absolute;top:14px;width:20px;height:20px;border-radius:50%;transform:translateX(-50%);
  background:#3a2c14;border:2px solid #8a6c33;display:flex;align-items:center;justify-content:center;font-size:10px;color:#e9d9ae;transition:.3s}
#prog .nd.done{background:var(--gold);border-color:#fff3cf;box-shadow:0 0 10px rgba(247,217,140,.8)}
#prog .nd span{position:absolute;top:21px;font-size:9px;color:#e9d9ae;white-space:nowrap}
#light{position:absolute;top:calc(72px + env(safe-area-inset-top));right:12px;width:120px;background:rgba(26,16,4,.55);
  border:1px solid rgba(232,182,76,.45);border-radius:14px;padding:6px 10px;color:#ffe9b8;font-size:11px}
#light .bar{height:8px;border-radius:6px;background:rgba(255,255,255,.15);margin-top:3px;overflow:hidden}
#light .fl{height:100%;width:60%;border-radius:6px;background:linear-gradient(90deg,#ff9d2e,#ffe08a);transition:.3s}
#starHud{position:absolute;top:calc(72px + env(safe-area-inset-top));left:12px;background:rgba(26,16,4,.55);
  border:1px solid rgba(232,182,76,.45);border-radius:14px;padding:6px 12px;color:#ffe9b8;font-size:13px}
#mute{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));right:12px;width:46px;height:46px;border-radius:50%;
  background:rgba(26,16,4,.6);border:1px solid rgba(232,182,76,.5);color:#ffe9b8;font-size:20px;pointer-events:auto}

#stick{position:fixed;width:120px;height:120px;border-radius:50%;background:rgba(255,240,200,.10);
  border:2px solid rgba(255,240,200,.4);z-index:8;pointer-events:none;left:22px;bottom:calc(26px + env(safe-area-inset-bottom))}
#nub{position:absolute;left:50%;top:50%;width:52px;height:52px;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 30%,#ffe9b8,#c9973b);box-shadow:0 4px 12px rgba(0,0,0,.4)}
#stickLbl{position:absolute;left:50%;top:-24px;transform:translateX(-50%);color:#ffe9b8;font-size:12px;white-space:nowrap;
  text-shadow:0 1px 3px #000;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.4}}
#hint{position:fixed;bottom:22vh;left:50%;transform:translateX(-50%);background:rgba(26,16,4,.75);color:#ffe9b8;
  padding:10px 20px;border-radius:30px;border:1px solid rgba(232,182,76,.5);z-index:6;font-size:14px;text-align:center;
  transition:opacity 1s;pointer-events:none}

.ov{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;
  background:radial-gradient(ellipse at center,rgba(30,18,4,.45),rgba(10,6,1,.82))}
.card{width:min(600px,94vw);max-height:92vh;overflow-y:auto;touch-action:pan-y;background:linear-gradient(165deg,#faf1dc,#efdcB4 60%,#e6cf9f);
  border-radius:22px;border:3px solid #b98a2e;box-shadow:0 18px 60px rgba(0,0,0,.6),inset 0 0 60px rgba(185,138,46,.15);
  padding:22px 22px 26px;color:var(--ink);text-align:center}
.card::-webkit-scrollbar{width:0}
.ribbon{display:inline-block;background:linear-gradient(180deg,#a5761f,#7c560f);color:#ffe9b8;border-radius:12px;
  padding:6px 22px;font-size:15px;font-weight:700;margin-bottom:8px;box-shadow:0 3px 8px rgba(0,0,0,.3)}
.card h1{font-size:clamp(26px,6vw,40px);font-weight:900;color:#5c3d0e;line-height:1.3}
.card h2{font-size:clamp(19px,4.6vw,26px);font-weight:900;color:#5c3d0e;margin:6px 0}
.card p{font-size:clamp(14px,3.7vw,17px);line-height:1.95;margin:12px 0;white-space:pre-line}
.btn{display:inline-block;background:linear-gradient(180deg,#f3c96a,#d59a2b);border:2px solid #8a6114;border-radius:16px;
  padding:13px 34px;font-size:18px;font-weight:900;color:#4a3106;box-shadow:0 6px 0 #8a6114,0 10px 18px rgba(0,0,0,.35);transition:.12s;margin-top:8px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #8a6114}
.btn.small{padding:9px 22px;font-size:15px}
.stars{font-size:34px;letter-spacing:6px;margin:6px 0}
.dots{display:flex;justify-content:center;gap:8px;margin:10px 0}
.dots i{width:12px;height:12px;border-radius:50%;background:#c9b183;border:2px solid #8a6c33}
.dots i.on{background:var(--gold);box-shadow:0 0 8px rgba(232,182,76,.9)}
.qtext{font-size:clamp(17px,4.6vw,22px);font-weight:900;color:#4a3106;margin:12px 0 16px;line-height:1.7}
.opt{display:block;width:100%;text-align:center;background:#fff8e8;border:2px solid #b98a2e;border-radius:14px;
  padding:13px 10px;margin:9px 0;font-size:clamp(14px,3.8vw,17px);font-weight:700;color:#4a3106;transition:.15s;line-height:1.6}
.opt:active{transform:scale(.98)}
.opt.good{background:#d9f3e2;border-color:var(--green);color:#1c5c38;animation:pop .3s}
.opt.bad{background:#f7d9d3;border-color:var(--red);color:#7c2618;animation:shake .35s}
.opt.off{opacity:.4;pointer-events:none}
@keyframes pop{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(6px)}75%{transform:translateX(-6px)}}
.why{background:#f3e6c4;border:2px dashed #b98a2e;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.9;margin-top:12px}
.why b{color:#8a5a10}
#toast{position:fixed;top:calc(120px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:15;
  background:rgba(30,20,4,.85);color:#ffe9b8;border:1px solid var(--gold);border-radius:30px;padding:10px 26px;
  font-size:15px;font-weight:700;opacity:0;transition:.5s;pointer-events:none;text-align:center;max-width:88vw}
#toast.show{opacity:1}
.tiny{font-size:12px;color:#8a6a2c;margin-top:14px;line-height:1.8}
.score{background:#fff8e8;border:2px solid #b98a2e;border-radius:14px;padding:12px;margin:12px 0;font-size:16px;font-weight:700}
.cross{font-size:34px;color:#a5761f;margin:4px 0}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <div id="prog"><div class="line"></div><div class="fill" id="pfill"></div></div>
  <div id="light">نور الإيمان 🔥<div class="bar"><div class="fl" id="lfill"></div></div></div>
  <div id="starHud">⭐ <span id="starN">0</span>/18</div>
  <button id="mute">🔊</button>
</div>
<div id="stick"><div id="stickLbl">اسحب هنا لفوق ⬆</div><div id="nub"></div></div>
<div id="hint" class="hidden">اسحب الدايرة (تحت الشمال) لفوق عشان تمشي ⬆️ — أو المس أي مكان في الشاشة واسحبي</div>
<div id="toast"></div>

<div id="title" class="ov">
  <div class="card">
    <div class="cross">✛</div>
    <h1>Fa
